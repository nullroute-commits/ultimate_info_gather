x-ci-service: &ci-service
  build:
    context: .
    dockerfile: Dockerfile.ci
  working_dir: /workspace
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    HOME: /tmp/netbox-deployment-factory
    PYTHONPATH: /workspace/src
    MYPY_CACHE_DIR: /tmp/netbox-deployment-factory/mypy-cache
    RUFF_CACHE_DIR: /tmp/netbox-deployment-factory/ruff-cache
  volumes:
    - .:/workspace
    - ..:/host-root

services:
  lint:
    <<: *ci-service
    command: ["bash", "-lc", "ruff check ."]

  typecheck:
    <<: *ci-service
    command: ["bash", "-lc", "mypy src"]

  test:
    <<: *ci-service
    command: ["bash", "-lc", "python -m pytest -q -o cache_dir=/tmp/netbox-deployment-factory/pytest-cache"]

  factory:
    <<: *ci-service
    entrypoint: ["python", "-m", "netbox_deployment_factory"]

  bundle:
    <<: *ci-service
    command:
      [
        "bash",
        "-lc",
        "rm -rf /workspace/.artifacts/ci-example && mkdir -p /workspace/.artifacts && python -m netbox_deployment_factory --report tests/fixtures/sample_report.json --output-dir /workspace/.artifacts/ci-example --track debian --deployment-name ci-example",
      ]
