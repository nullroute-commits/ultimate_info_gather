global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    origin_prometheus: netbox-stack

alerting:
  alertmanagers:
  - static_configs:
    - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
    - targets: ['prometheus:9090']

  - job_name: 'grafana'
    static_configs:
    - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
    - targets: ['loki:3100']

  - job_name: 'alloy'
    static_configs:
    - targets: ['alloy:12345']

  - job_name: 'node-exporter'
    static_configs:
    - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
    - targets: ['cadvisor:8080']

  - job_name: 'netbox'
    metrics_path: /metrics
    static_configs:
    - targets: ['netbox:8080']

  - job_name: 'snmp-exporter'
    static_configs:
    - targets: ['snmp-exporter:9116']
