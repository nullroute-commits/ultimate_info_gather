services:
  traefik-certgen:
    image: alpine/openssl:3.5.5
    restart: "no"
    entrypoint: ["/bin/sh"]
    command: ["/opt/scripts/generate-traefik-cert.sh"]
    volumes:
      - traefik-certs:/certs
      - ./scripts:/opt/scripts:ro
    networks:
      - edge

  traefik:
    image: traefik:v3.6.13
    restart: unless-stopped
    depends_on:
      traefik-certgen:
        condition: service_completed_successfully
      waf:
        condition: service_started
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
    ports:
      - "192.168.1.179:443:443" 
    volumes:
      - traefik-certs:/certs:ro
      - ./configuration/traefik:/etc/traefik/dynamic:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - app
      - identity

  waf:
    image: owasp/modsecurity-crs:4.25.0-nginx-lts
    restart: unless-stopped
    depends_on:
      netbox:
        condition: service_healthy
    volumes:
      - ./configuration/waf/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app
      - data

  postgres:
    image: postgres:18
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_PASSWORD="$(cat /run/secrets/db_password)"
        unset POSTGRES_PASSWORD_FILE
        exec docker-entrypoint.sh postgres
    env_file:
      - env/postgres.env
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - data

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - data

  diode-auth:
    image: netboxlabs/diode-auth:1.12.0
    restart: unless-stopped
    depends_on:
      hydra:
        condition: service_healthy
    env_file:
      - env/diode.env
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - data
      - identity

  diode-ingester:
    image: netboxlabs/diode-ingester:1.13.0
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    env_file:
      - env/diode.env
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - data

  diode-reconciler:
    image: netboxlabs/diode-reconciler:1.13.0
    restart: unless-stopped
    depends_on:
      netbox:
        condition: service_healthy
      diode-auth:
        condition: service_started
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - env/diode.env
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - data

  netbox:
    build:
      context: .
      dockerfile: Dockerfile-Plugins
      args:
        NETBOX_IMAGE: netboxcommunity/netbox:v4.5.7
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      diode-auth:
        condition: service_started
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
      - superuser_name
      - superuser_password
      - superuser_api_token
    healthcheck:
      test:
        [
          "CMD",
          "/opt/netbox/venv/bin/python",
          "-c",
          "from urllib.request import urlopen; import sys; response = urlopen('http://127.0.0.1:8080/login/', timeout=10); sys.exit(0 if response.status == 200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 8m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/etc/netbox/reports
      - netbox-scripts:/etc/netbox/scripts
    networks:
      - data

  netbox-worker:
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    networks:
      - data

  netbox-worker-2:
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    networks:
      - data

  netbox-superuser-sync:
    image: netbox-deploy:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/bin/sh", "/opt/netbox/bootstrap/sync-superuser.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - ./scripts:/opt/netbox/bootstrap:ro
      - token-store:/token-store
    networks:
      - data

  diode-credential-setup:
    image: netbox-deploy:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
      netbox-superuser-sync:
        condition: service_completed_successfully
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
    command: ["/bin/sh", "/opt/netbox/bootstrap/setup-diode-credential.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - ./scripts:/opt/netbox/bootstrap:ro
    networks:
      - data

  device-type-library-import:
    profiles: ["device-type-library-import"]
    image: netbox-deploy:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
      - env/device-type-library-import.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/bin/sh", "/opt/netbox/import-scripts/run-device-type-library-import.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tmpfs:
      - /tmp
    volumes:
      - ./scripts:/opt/netbox/import-scripts:ro
    networks:
      - data

  netbox-geo-foss:
    profiles: ["geo-foss-import"]
    build:
      context: .
      dockerfile: Dockerfile-GeoFoss
    image: netbox-deploy-geo-foss:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
      netbox-superuser-sync:
        condition: service_completed_successfully
    env_file:
      - env/geo-foss.env
    secrets:
      - superuser_api_token
    command: ["/bin/sh", "/opt/geo-foss/run-geo-foss-import.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - geo-foss-cache:/app/cache
      - ./scripts:/opt/geo-foss:ro
      - token-store:/token-store:ro
    networks:
      - data

  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.4
    profiles: ["security-observability"]
    restart: unless-stopped
    network_mode: host
    environment:
      WAZUH_MANAGER_SERVER: "127.0.0.1"
      WAZUH_AGENT_NAME: "netbox-deploy-wazuh-agent"

  orb-agent:
    image: netboxlabs/orb-agent:2.7.0
    profiles: ["orb-discovery"]
    restart: unless-stopped
    depends_on:
      diode-auth:
        condition: service_started
    env_file:
      - env/orb.env
    command: ["run", "-c", "/opt/orb/agent.yaml"]
    user: "0:0"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configuration/orb:/opt/orb:ro

  monitoring-dashboard-init:
    image: alpine:3.23
    profiles: ["monitoring"]
    restart: "no"
    entrypoint: ["/bin/sh"]
    command: ["/opt/scripts/fetch-monitoring-dashboards.sh", "/dashboards/performance_overview"]
    volumes:
      - grafana-dashboards:/dashboards
      - ./scripts:/opt/scripts:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.2
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      monitoring-dashboard-init:
        condition: service_completed_successfully
    env_file:
      - env/monitoring.env
    ports:
      - "192.168.1.179:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
      - ./configuration/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.11.0
    profiles: ["monitoring"]
    restart: unless-stopped
    extra_hosts:
      - "node-exporter:host-gateway"
      - "snmp-exporter:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-admin-api
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
      - ./configuration/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
      - data

  loki:
    image: grafana/loki:3.7.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configuration/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.15.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "192.168.1.179:1514:1514"
      - "127.0.0.1:1514:1514"
    volumes:
      - ./configuration/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - monitoring

  syslog-ng:
    image: balabit/syslog-ng:4.11.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: -edv
    depends_on:
      alloy:
        condition: service_started
    network_mode: host
    volumes:
      - ./configuration/monitoring/syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro

  node-exporter:
    image: prom/node-exporter:v1.11.1
    profiles: ["monitoring"]
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    profiles: ["monitoring"]
    restart: unless-stopped
    network_mode: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring

  # ═══════════════════════════════════════════════════════════════════════
  # Identity Provider: Authentik
  # ═══════════════════════════════════════════════════════════════════════

  authentik-postgres:
    image: postgres:18
    profiles: ["identity"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD_FILE: /run/secrets/authentik_pg_password
    secrets:
      - authentik_pg_password
    volumes:
      - authentik-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE", "CHOWN", "FOWNER", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - identity

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.2.2
    profiles: ["identity"]
    command: server
    restart: unless-stopped
    depends_on:
      authentik-postgres:
        condition: service_healthy
    env_file:
      - env/authentik.env
    secrets:
      - authentik_secret_key
      - authentik_pg_password
    shm_size: 512mb
    volumes:
      - authentik-data:/data
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - identity
      - app

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.2.2
    profiles: ["identity"]
    command: worker
    restart: unless-stopped
    depends_on:
      authentik-postgres:
        condition: service_healthy
    env_file:
      - env/authentik.env
    secrets:
      - authentik_secret_key
      - authentik_pg_password
    shm_size: 512mb
    volumes:
      - authentik-data:/data
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - identity

  authentik-bootstrap-netbox:
    image: ghcr.io/goauthentik/server:2026.2.2
    profiles: ["identity"]
    restart: "no"
    depends_on:
      authentik-server:
        condition: service_healthy
      netbox:
        condition: service_healthy
    env_file:
      - env/authentik.env
    environment:
      NETBOX_PUBLIC_URL: https://192.168.1.179
      NETBOX_INTERNAL_URL: http://waf:8081
    secrets:
      - authentik_secret_key
      - authentik_pg_password
    entrypoint: ["/bin/sh", "/opt/authentik/bootstrap/authentik-bootstrap-netbox.sh"]
    volumes:
      - ./scripts:/opt/authentik/bootstrap:ro
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - identity
      - app

  # ═══════════════════════════════════════════════════════════════════════
  # Ory Hydra: OAuth2/OIDC provider for Diode
  # ═══════════════════════════════════════════════════════════════════════

  hydra-postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydra
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD_FILE: /run/secrets/hydra_pg_password
    secrets:
      - hydra_pg_password
    volumes:
      - hydra-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE", "CHOWN", "FOWNER", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - identity

  hydra-migrate:
    image: oryd/hydra:v2.3.0
    restart: "no"
    depends_on:
      hydra-postgres:
        condition: service_healthy
    env_file:
      - env/hydra.env
    secrets:
      - hydra_pg_password
      - hydra_system_secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        hydra_pw="$$(cat /run/secrets/hydra_pg_password)"
        export DSN="postgres://hydra:$$hydra_pw@hydra-postgres:5432/hydra?sslmode=disable"
        export SECRETS_SYSTEM="$$(cat /run/secrets/hydra_system_secret)"
        exec hydra migrate sql --yes --read-from-env
    networks:
      - identity

  hydra:
    image: oryd/hydra:v2.3.0
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    env_file:
      - env/hydra.env
    secrets:
      - hydra_pg_password
      - hydra_system_secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        hydra_pw="$$(cat /run/secrets/hydra_pg_password)"
        export DSN="postgres://hydra:$$hydra_pw@hydra-postgres:5432/hydra?sslmode=disable"
        export SECRETS_SYSTEM="$$(cat /run/secrets/hydra_system_secret)"
        exec hydra serve all --dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4444/health/alive || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - identity
      - data

  hydra-bootstrap-clients:
    image: oryd/hydra:v2.3.0
    restart: "no"
    depends_on:
      hydra:
        condition: service_healthy
    env_file:
      - env/hydra.env
    secrets:
      - hydra_pg_password
      - hydra_system_secret
      - diode_client_id
      - diode_client_secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DIODE_CLIENT_ID=$$(cat /run/secrets/diode_client_id)
        DIODE_CLIENT_SECRET=$$(cat /run/secrets/diode_client_secret)
        hydra delete oauth2-client "$$DIODE_CLIENT_ID"           --endpoint http://hydra:4445 2>/dev/null || true
        hydra create oauth2-client           --endpoint http://hydra:4445           --id "$$DIODE_CLIENT_ID"           --secret "$$DIODE_CLIENT_SECRET"           --grant-type client_credentials           --scope openid,diode           --token-endpoint-auth-method client_secret_post
        echo "Diode OAuth2 client registered successfully"
        NETBOX_CLIENT_ID="netbox-to-diode"
        hydra delete oauth2-client "$$NETBOX_CLIENT_ID"           --endpoint http://hydra:4445 2>/dev/null || true
        hydra create oauth2-client           --endpoint http://hydra:4445           --id "$$NETBOX_CLIENT_ID"           --secret "$$DIODE_CLIENT_SECRET"           --grant-type client_credentials           --scope openid,diode           --token-endpoint-auth-method client_secret_post
        echo "NetBox-to-Diode OAuth2 client registered successfully"
    networks:
      - identity

secrets:
  db_password:
    file: secrets/db_password
  api_token_pepper_1:
    file: secrets/api_token_pepper_1
  secret_key:
    file: secrets/secret_key
  superuser_name:
    file: secrets/superuser_name
  superuser_password:
    file: secrets/superuser_password
  superuser_api_token:
    file: secrets/superuser_api_token
  diode_redis_password:
    file: secrets/diode_redis_password
  netbox_to_diode:
    file: secrets/netbox_to_diode
  diode_client_id:
    file: secrets/diode_client_id
  diode_client_secret:
    file: secrets/diode_client_secret
  authentik_secret_key:
    file: secrets/authentik_secret_key
  authentik_pg_password:
    file: secrets/authentik_pg_password
  hydra_pg_password:
    file: secrets/hydra_pg_password
  hydra_system_secret:
    file: secrets/hydra_system_secret


volumes:
  traefik-certs:
  postgres-data:
  valkey-data:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  geo-foss-cache:
  token-store:
  grafana-data:
  grafana-dashboards:
  prometheus-data:
  authentik-pg-data:
  authentik-data:
  hydra-pg-data:

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/27
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.32/27
  data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.64/27
  security:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.96/28
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.128/27
  identity:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.160/27
