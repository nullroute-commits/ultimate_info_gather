services:
  traefik-certgen:
    image: alpine/openssl:latest
    restart: "no"
    entrypoint: ["/bin/sh"]
    command: ["/opt/scripts/generate-traefik-cert.sh"]
    volumes:
      - traefik-certs:/certs
      - ./scripts:/opt/scripts:ro
    networks:
      - edge

  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    depends_on:
      traefik-certgen:
        condition: service_completed_successfully
      waf:
        condition: service_started
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
    ports:
      - "10.1.0.190:443:443"
    volumes:
      - traefik-certs:/certs:ro
      - ./configuration/traefik:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - app

  waf:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    depends_on:
      netbox:
        condition: service_healthy
    volumes:
      - ./configuration/waf/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app
      - data

  postgres:
    image: postgres:18
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_PASSWORD="$(cat /run/secrets/db_password)"
        unset POSTGRES_PASSWORD_FILE
        exec docker-entrypoint.sh postgres
    env_file:
      - env/postgres.env
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - data

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - data

  diode-auth:
    image: netboxlabs/diode-auth:1.12.0
    restart: unless-stopped
    env_file:
      - env/diode.env
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - data

  diode-ingester:
    image: netboxlabs/diode-ingester:1.13.0
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    env_file:
      - env/diode.env
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - data

  diode-reconciler:
    image: netboxlabs/diode-reconciler:1.13.0
    restart: unless-stopped
    depends_on:
      netbox:
        condition: service_healthy
      diode-auth:
        condition: service_started
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - env/diode.env
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - data

  netbox:
    build:
      context: .
      dockerfile: Dockerfile-Plugins
      args:
        NETBOX_IMAGE: netboxcommunity/netbox:v4.5.4
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      diode-auth:
        condition: service_started
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
      - superuser_name
      - superuser_password
      - superuser_api_token
    healthcheck:
      test:
        [
          "CMD",
          "/opt/netbox/venv/bin/python",
          "-c",
          "from urllib.request import urlopen; import sys; response = urlopen('http://127.0.0.1:8080/login/', timeout=10); sys.exit(0 if response.status == 200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 8m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/etc/netbox/reports
      - netbox-scripts:/etc/netbox/scripts
    networks:
      - data

  netbox-worker:
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    networks:
      - data

  netbox-worker-2:
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    networks:
      - data

  netbox-worker-3:
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    networks:
      - data

  netbox-worker-4:
    image: netbox-deploy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    networks:
      - data

  netbox-superuser-sync:
    image: netbox-deploy:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/bin/sh", "/opt/netbox/bootstrap/sync-superuser.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - ./scripts:/opt/netbox/bootstrap:ro
      - token-store:/token-store
    networks:
      - data

  diode-credential-setup:
    image: netbox-deploy:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
      netbox-superuser-sync:
        condition: service_completed_successfully
    env_file:
      - env/netbox.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
    command: ["/bin/sh", "/opt/netbox/bootstrap/setup-diode-credential.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - ./scripts:/opt/netbox/bootstrap:ro
    networks:
      - data

  device-type-library-import:
    profiles: ["device-type-library-import"]
    image: netbox-deploy:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
    env_file:
      - env/netbox.env
      - env/device-type-library-import.env
    secrets:
      - db_password
      - api_token_pepper_1
      - secret_key
      - netbox_to_diode
      - superuser_name
      - superuser_password
      - superuser_api_token
    command: ["/bin/sh", "/opt/netbox/import-scripts/run-device-type-library-import.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tmpfs:
      - /tmp
    volumes:
      - ./scripts:/opt/netbox/import-scripts:ro
    networks:
      - data

  netbox-geo-foss:
    profiles: ["geo-foss-import"]
    build:
      context: .
      dockerfile: Dockerfile-GeoFoss
    image: netbox-deploy-geo-foss:local
    restart: "no"
    depends_on:
      netbox:
        condition: service_healthy
      netbox-superuser-sync:
        condition: service_completed_successfully
    env_file:
      - env/geo-foss.env
    secrets:
      - superuser_api_token
    command: ["/bin/sh", "/opt/geo-foss/run-geo-foss-import.sh"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    volumes:
      - geo-foss-cache:/app/cache
      - ./scripts:/opt/geo-foss:ro
      - token-store:/token-store:ro
    networks:
      - data

  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.3
    profiles: ["security-observability"]
    restart: unless-stopped
    environment:
      WAZUH_MANAGER: "wazuh-manager"
      WAZUH_AGENT_NAME: "netbox-deploy-wazuh-agent"
    networks:
      - security

  orb-agent:
    image: netboxlabs/orb-agent:2.7.0
    profiles: ["orb-discovery"]
    restart: unless-stopped
    depends_on:
      diode-auth:
        condition: service_started
    env_file:
      - env/orb.env
    command: ["run", "-c", "/opt/orb/agent.yaml"]
    user: "0:0"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configuration/orb:/opt/orb:ro

  monitoring-dashboard-init:
    image: alpine:3.20
    profiles: ["monitoring"]
    restart: "no"
    entrypoint: ["/bin/sh"]
    command: ["/opt/scripts/fetch-monitoring-dashboards.sh", "/dashboards/performance_overview"]
    volumes:
      - grafana-dashboards:/dashboards
      - ./scripts:/opt/scripts:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      monitoring-dashboard-init:
        condition: service_completed_successfully
    env_file:
      - env/monitoring.env
    ports:
      - "10.1.0.190:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
      - ./configuration/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-admin-api
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
      - ./configuration/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
      - data

  loki:
    image: grafana/loki:3.2.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configuration/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.2.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    ports:
      - "10.1.0.190:1514:1514"
    volumes:
      - ./configuration/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    networks:
      - monitoring

  syslog-ng:
    image: balabit/syslog-ng:4.8.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: -edv
    depends_on:
      promtail:
        condition: service_started
    ports:
      - "10.1.0.190:514:514/udp"
      - "10.1.0.190:601:601"
    volumes:
      - ./configuration/monitoring/syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  snmp-exporter:
    image: prom/snmp-exporter:v0.27.0
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring

secrets:
  db_password:
    file: secrets/db_password
  api_token_pepper_1:
    file: secrets/api_token_pepper_1
  secret_key:
    file: secrets/secret_key
  superuser_name:
    file: secrets/superuser_name
  superuser_password:
    file: secrets/superuser_password
  superuser_api_token:
    file: secrets/superuser_api_token
  diode_redis_password:
    file: secrets/diode_redis_password
  netbox_to_diode:
    file: secrets/netbox_to_diode
  diode_client_id:
    file: secrets/diode_client_id
  diode_client_secret:
    file: secrets/diode_client_secret

volumes:
  traefik-certs:
  postgres-data:
  valkey-data:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  geo-foss-cache:
  token-store:
  grafana-data:
  grafana-dashboards:
  prometheus-data:

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/27
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.32/27
  data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.64/27
  security:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.96/28
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.112/27
